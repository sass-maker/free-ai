name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install complexity analyzer
        run: pip install lizard==1.23.0

      - name: Run quality gate
        run: pnpm run quality

      - name: Build playground
        run: pnpm run build

      - name: Build Astro docs site (patched dependency consumer)
        run: pnpm --filter @sass-maker/ai-gateway-docs build

      - name: Compile Worker for binding smoke
        run: pnpm exec wrangler deploy --dry-run --outdir .fleet-runtime

      - name: Verify bindings in the compiled Workers runtime
        run: node --test scripts/smoke-fleet-bindings.mjs
