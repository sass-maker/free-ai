name: Check Provider Catalogs

on:
  schedule:
    - cron: '0 9 * * 0' # Every Sunday at 09:00 UTC
  workflow_dispatch:
    inputs:
      qualify_cf_release:
        description: 'Qualify deployed CF migration with one budgeted Aura request'
        type: boolean
        default: false
      inspect_budget_only:
        description: 'Read shared Vectorize ledger status without inference or reservations'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: provider-catalog-resync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect-budget:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_budget_only && !inputs.qualify_cf_release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read Vectorize admission ledgers
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          const states = new Set(['available', 'uninitialized', 'stale', 'invalid', 'baseline_unavailable']);
          const sources = new Set(['ledger', 'verified_monthly_baseline', null]);
          const ledger = (row) => {
            if (!row || !states.has(row.state) || !sources.has(row.source)
              || typeof row.initialized !== 'boolean' || typeof row.baselineVerified !== 'boolean'
              || !Number.isSafeInteger(row.cap) || row.cap < 0) throw new Error('Invalid ledger metadata');
            const available = row.state === 'available';
            if (row.baselineVerified !== available || (available
              ? !Number.isSafeInteger(row.used) || row.used < 0 || !Number.isSafeInteger(row.remaining) || row.remaining < 0 || row.used + row.remaining !== row.cap
              : row.used !== null || row.remaining !== null)) throw new Error('Invalid ledger amounts');
            return Object.fromEntries(['state', 'initialized', 'source', 'used', 'cap', 'remaining', 'baselineVerified'].map(key => [key, row[key]]));
          };
          if (!process.env.GATEWAY_API_KEY) throw new Error('Gateway read connection unavailable');
          const response = await fetch('https://ai-gateway.sassmaker.com/v1/budget/vectorize', {
            headers: {Authorization: `Bearer ${process.env.GATEWAY_API_KEY}`},
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Budget read returned HTTP ${response.status}`);
          const report = await response.json();
          if (report.monthKey !== new Date().toISOString().slice(0, 7)) throw new Error('Budget month is not current');
          console.log(JSON.stringify({monthKey: report.monthKey, query: ledger(report.query), storage: ledger(report.storage)}));
          NODE

      - name: Read current Vectorize usage and occupancy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!/^[a-f0-9]{32}$/i.test(account ?? '') || !token) {
            console.log(JSON.stringify({surface: 'providerVectorize', state: 'connection_unavailable'}));
            process.exit(0);
          }
          const read = async (path) => {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
                headers: {Authorization: `Bearer ${token}`}, redirect: 'error', signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) return {status: response.status, available: false};
              const payload = await response.json();
              return {status: response.status, available: payload.success === true, payload};
            } catch {
              return {status: null, available: false};
            }
          };
          const usage = await read('/billable-usage');
          const usageRows = Array.isArray(usage.payload?.result) ? usage.payload.result : [];
          const vectorizeRows = usageRows.filter(row => /vectorize/i.test(`${row.ServiceName ?? ''} ${row.ServiceFamilyName ?? ''}`));
          const fields = ['ServiceName', 'ChargeDescription', 'BillingPeriodStart', 'ChargePeriodStart', 'ChargePeriodEnd', 'ConsumedQuantity', 'ConsumedUnit', 'PricingQuantity', 'PricingUnit', 'CumulatedPricingQuantity'];
          console.log(JSON.stringify({surface: 'vectorizeUsage', status: usage.status, available: usage.available,
            rows: vectorizeRows.map(row => Object.fromEntries(fields.map(key => [key, row[key] ?? null])))}));
          const indexes = await read('/vectorize/v2/indexes?per_page=100');
          const rows = Array.isArray(indexes.payload?.result) ? indexes.payload.result : [];
          console.log(JSON.stringify({surface: 'vectorizeInventory', status: indexes.status, available: indexes.available,
            pagination: indexes.payload?.result_info ?? null, returned: rows.length, truncated: rows.length > 50}));
          for (const index of rows.slice(0, 50)) {
            if (typeof index.name !== 'string') continue;
            const info = await read(`/vectorize/v2/indexes/${encodeURIComponent(index.name)}/info`);
            const dimensions = info.payload?.result?.dimensions ?? index.config?.dimensions;
            const vectorCount = info.payload?.result?.vectorCount;
            const storedDimensions = Number.isSafeInteger(dimensions) && Number.isSafeInteger(vectorCount)
              && Number.isSafeInteger(dimensions * vectorCount) ? dimensions * vectorCount : null;
            console.log(JSON.stringify({surface: 'vectorizeIndex', name: index.name, status: info.status, available: info.available,
              dimensions: dimensions ?? null, vectorCount: vectorCount ?? null, storedDimensions, observedAt: new Date().toISOString()}));
          }
          NODE

  qualify-cf-release:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_cf_release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Qualify source, admission, authentication and real Aura audio
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const expected = '6007ac0b3e274d5fa5c2fd2abcf27808594ddc34';
          const origin = 'https://ai-gateway.sassmaker.com';
          const model = '@cf/deepgram/aura-2-en';
          const input = 'Cloudflare release check.';
          const reservation = Math.ceil(Buffer.byteLength(input) * 2727.27 * 1.2 / 1000);
          const request = (path, options = {}) => fetch(origin + path, {
            ...options, redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          const json = async response => { assert.equal(response.status, 200, 'Read returned unexpected status'); return response.json(); };
          const key = process.env.GATEWAY_API_KEY;
          assert.ok(key, 'Gateway connection unavailable');
          execFileSync('ffprobe', ['-version'], {stdio: 'ignore'});
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          assert.match(account ?? '', /^[a-f0-9]{32}$/i);
          assert.ok(token, 'Provider read connection unavailable');
          const cfRead = async path => {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/free-ai-gateway${path}`, {
              headers: {Authorization: `Bearer ${token}`}, redirect: 'error', signal: AbortSignal.timeout(15000),
            });
            assert.equal(response.status, 200, 'Worker metadata read failed');
            const body = await response.json(); assert.equal(body.success, true); return body.result;
          };
          const deployment = (await cfRead('/deployments')).deployments?.[0];
          assert.equal(deployment?.versions?.length, 1, 'Expected one active version');
          const active = deployment.versions[0]; assert.equal(active.percentage, 100);
          const version = await cfRead(`/versions/${encodeURIComponent(active.version_id)}`);
          assert.equal(version.annotations?.['workers/tag'], expected, 'Deployed source differs');
          console.log(JSON.stringify({surface: 'workerRelease', source: expected, version: active.version_id, percentage: active.percentage}));
          const health = await request('/health'); assert.equal(health.status, 200);
          const catalog = await json(await request('/v1/models'));
          const retired = /@cf\/(?:deepseek-ai\/deepseek-r1-distill-qwen-32b|meta\/llama-3\.2-[13]b-instruct|myshell-ai\/melotts)/;
          assert.equal(retired.test(JSON.stringify(catalog)), false, 'Retiring default remains exposed');
          const before = await json(await request('/v1/budget'));
          assert.equal(before.cap, 9500); assert.equal(before.dayKey, new Date().toISOString().slice(0, 10));
          assert.ok(before.remaining >= reservation, 'Insufficient bounded qualification budget');
          const payload = {model, input, voice: 'alloy', response_format: 'mp3', project_id: 'free-ai'};
          const headers = {'content-type': 'application/json', 'x-gateway-force-provider': 'workers_ai'};
          const anonymous = await request('/v1/audio/speech', {method: 'POST', headers, body: JSON.stringify(payload)});
          assert.equal(anonymous.status, 401); await anonymous.body?.cancel();
          const invalid = await request('/v1/audio/speech', {method: 'POST', headers: {...headers, Authorization: `Bearer ${key}`}, body: JSON.stringify({...payload, speed: 2})});
          assert.equal(invalid.status, 400); assert.equal((await invalid.json()).error?.code, 'invalid_tts_options');
          const audio = await request('/v1/audio/speech', {method: 'POST', headers: {...headers, Authorization: `Bearer ${key}`}, body: JSON.stringify(payload)});
          assert.equal(audio.status, 200, 'Aura qualification failed');
          assert.equal(audio.headers.get('x-gateway-provider'), 'workers_ai');
          assert.equal(audio.headers.get('x-gateway-model'), model);
          assert.equal(audio.headers.get('x-gateway-project-id'), 'free-ai');
          assert.match(audio.headers.get('content-type') ?? '', /^audio\/mpeg/);
          const bytes = Buffer.from(await audio.arrayBuffer()); assert.ok(bytes.length > 100 && bytes.length < 1048576);
          const file = join(process.env.RUNNER_TEMP, 'free-ai-aura-qualification.mp3'); await writeFile(file, bytes, {mode: 0o600});
          const probe = JSON.parse(execFileSync('ffprobe', ['-v', 'error', '-show_entries', 'stream=codec_name,codec_type,sample_rate', '-of', 'json', file], {encoding: 'utf8'}));
          assert.ok(probe.streams?.some(stream => stream.codec_type === 'audio' && stream.codec_name === 'mp3'));
          const after = await json(await request('/v1/budget'));
          assert.equal(after.cap, 9500); assert.equal(after.dayKey, before.dayKey); assert.ok(after.used >= before.used + reservation);
          console.log(JSON.stringify({surface: 'auraQualification', model, bytes: bytes.length, reservation, beforeUsed: before.used, afterUsed: after.used, cap: after.cap, anonymousStatus: anonymous.status, invalidOptionsStatus: invalid.status, decodedStreams: probe.streams}));
          NODE

  check:
    if: github.event_name != 'workflow_dispatch' || (!inputs.inspect_budget_only && !inputs.qualify_cf_release)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check configured models against official catalogs
        id: catalog
        env:
          FREE_AI_BASE_URL: https://ai-gateway.sassmaker.com
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/check-model-ids.mjs --json > catalog-report.json
          checker_exit=$?
          set -e
          node -e "JSON.parse(require('fs').readFileSync('catalog-report.json', 'utf8'))"
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const report = JSON.parse(require('fs').readFileSync('catalog-report.json', 'utf8'));
          console.log(`stale=${report.stale.length}`);
          console.log(`new=${report.new.length}`);
          console.log(`drift=${report.stale.length + report.new.length}`);
          console.log(`incomplete=${report.summary.incompleteCatalogs}`);
          console.log(`credential_gaps=${report.summary.credentialGaps}`);
          console.log(`catalog_errors=${report.summary.catalogErrors}`);
          NODE
          echo "checker_exit=$checker_exit" >> "$GITHUB_OUTPUT"

      - name: Build conservative registry patch
        if: steps.catalog.outputs.drift != '0'
        env:
          FREE_AI_BASE_URL: https://ai-gateway.sassmaker.com
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          node scripts/check-model-ids.mjs --patch
          git diff --binary -- src/config.ts > model-sync.patch

      - name: Run bounded provider replay smoke
        id: smoke
        env:
          FREE_AI_BASE_URL: https://ai-gateway.sassmaker.com
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/smoke-text-providers.mjs > smoke-report.json
          smoke_exit=$?
          set -e
          node -e "JSON.parse(require('fs').readFileSync('smoke-report.json', 'utf8'))"
          smoke_status=$(node -p "JSON.parse(require('fs').readFileSync('smoke-report.json','utf8')).status")
          echo "exit=$smoke_exit" >> "$GITHUB_OUTPUT"
          echo "status=$smoke_status" >> "$GITHUB_OUTPUT"

      - name: Check live provider health
        id: live-health
        env:
          FREE_AI_BASE_URL: https://ai-gateway.sassmaker.com
        shell: bash
        run: |
          set +e
          node scripts/check-live-provider-health.mjs > live-health-report.json
          health_exit=$?
          set -e
          node -e "JSON.parse(require('fs').readFileSync('live-health-report.json', 'utf8'))"
          echo "exit=$health_exit" >> "$GITHUB_OUTPUT"
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const report = JSON.parse(require('fs').readFileSync('live-health-report.json', 'utf8'));
          console.log(`status=${report.ok ? 'healthy' : 'failed'}`);
          NODE

      - name: Summarize provider resync
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('catalog-report.json', 'utf8'));
          const smoke = JSON.parse(fs.readFileSync('smoke-report.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('live-health-report.json', 'utf8'));
          const incomplete = report.catalogs.filter((catalog) => catalog.status !== 'ok');
          console.log('## Provider resync');
          console.log(`- Catalog coverage: ${report.summary.checkedCatalogs}/${report.summary.managedCatalogs}`);
          console.log(`- Registry drift: ${report.stale.length} stale, ${report.new.length} new`);
          console.log(`- Replay smoke: ${smoke.status}`);
          console.log(`- Live gateway health: ${health.ok ? 'healthy' : 'failed'}`);
          console.log(`- Live 7-day failure rate: ${(health.analytics_7d.failure_rate * 100).toFixed(2)}%`);
          if (incomplete.length) {
            console.log('\n### Incomplete catalogs');
            for (const item of incomplete) console.log(`- ${item.provider}: ${item.status} - ${item.reason}`);
          }
          NODE

      - name: Upload provider resync evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-resync-${{ github.run_id }}
          path: |
            catalog-report.json
            smoke-report.json
            live-health-report.json
            model-sync.patch
          if-no-files-found: warn

      - name: Maintain registry issue
        if: always() && steps.catalog.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[provider-registry] Catalog drift or coverage gap'
          HAS_PROBLEM: ${{ steps.catalog.outputs.drift != '0' || steps.catalog.outputs.incomplete != '0' || steps.catalog.outputs.checker_exit == '2' || steps.smoke.outputs.exit != '0' || steps.live-health.outputs.exit != '0' }}
        shell: bash
        run: |
          node - <<'NODE' > issue-body.md
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('catalog-report.json', 'utf8'));
          const smoke = JSON.parse(fs.readFileSync('smoke-report.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('live-health-report.json', 'utf8'));
          console.log(`Automated provider resync found a condition requiring review in run ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}.`);
          console.log(`\n- Catalog coverage: ${report.summary.checkedCatalogs}/${report.summary.managedCatalogs}`);
          console.log(`- Stale models: ${report.stale.length}`);
          console.log(`- New models: ${report.new.length}`);
          console.log(`- Replay smoke: ${smoke.status}`);
          console.log(`- Live gateway health: ${health.ok ? 'healthy' : 'failed'}`);
          console.log('\nIncomplete catalogs:');
          const incomplete = report.catalogs.filter((catalog) => catalog.status !== 'ok');
          if (!incomplete.length) console.log('- None');
          for (const item of incomplete) console.log(`- ${item.provider}: ${item.status} - ${item.reason}`);
          console.log('\nDownload the workflow artifact for the full reports and optional conservative patch. Review before enabling any model.');
          NODE
          issues=$(gh issue list --state all --search "\"$TITLE\" in:title" --limit 10 --json number,title,state)
          number=$(jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' <<< "$issues" | head -n 1)
          state=$(jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .state' <<< "$issues" | head -n 1)
          if [ "$HAS_PROBLEM" = "true" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$TITLE" --body-file issue-body.md
            else
              if [ "$state" = "CLOSED" ]; then gh issue reopen "$number"; fi
              gh issue comment "$number" --body-file issue-body.md
            fi
          elif [ -n "$number" ] && [ "$state" = "OPEN" ]; then
            gh issue close "$number" --comment "Recovered in workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

      - name: Fail on stale models or product-health failure
        if: steps.catalog.outputs.stale != '0' || steps.catalog.outputs.checker_exit == '2' || steps.live-health.outputs.exit != '0' || (steps.smoke.outputs.status != 'skipped' && steps.smoke.outputs.exit != '0')
        run: exit 1
