name: Check Model IDs

on:
  schedule:
    - cron: '0 9 * * 0' # Every Sunday at 9am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check model IDs against live APIs
        id: check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/check-model-ids.mjs --json > report.json 2>&1 || true
          STALE=$(node -e "const r=JSON.parse(require('fs').readFileSync('report.json','utf-8')); console.log(r.stale.length)")
          NEW=$(node -e "const r=JSON.parse(require('fs').readFileSync('report.json','utf-8')); console.log((r.new||[]).length)")
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "drift=$((STALE + NEW))" >> "$GITHUB_OUTPUT"
          cat report.json

      - name: Patch config and preserve evidence
        if: steps.check.outputs.drift != '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/check-model-ids.mjs --patch
          git diff --binary -- src/config.ts > model-sync.patch

          STALE_LIST=$(node -e "
            const r=JSON.parse(require('fs').readFileSync('report.json','utf-8'));
            r.stale.forEach(m => console.log('- \`'+m.provider+'/'+m.model+'\` (id: '+m.id+')'));
          ")
          NEW_LIST=$(node -e "
            const r=JSON.parse(require('fs').readFileSync('report.json','utf-8'));
            (r.new||[]).forEach(m => console.log('- \`'+m.provider+'/'+m.model+'\`'));
          ")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Model registry drift detected

          ### Stale models

          ${STALE_LIST:-_none_}

          ### New models

          ${NEW_LIST:-_none_}

          Download \`model-sync.patch\` from the workflow artifacts, review the
          conservative defaults, and apply it manually.
          EOF

      - name: Upload model drift evidence
        if: steps.check.outputs.drift != '0'
        uses: actions/upload-artifact@v7
        with:
          name: model-drift-${{ github.run_id }}
          path: |
            report.json
            model-sync.patch
          if-no-files-found: error
